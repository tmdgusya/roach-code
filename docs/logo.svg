<svg xmlns="http://www.w3.org/2000/svg" width="740" height="150" viewBox="0 0 740 150" role="img" aria-label="Roach Code — a multi-model coding agent for your terminal">
  <title>Roach Code</title>
  <defs>
    <!-- Warm clay → amber, grounded in the live TUI theme tokens (theme.go:
         graphite #d97757) and echoing the mascot's gold coins. The drawn bug
         lives in mascot.png now — this is the wordmark only. -->
    <linearGradient id="rc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ef6c3b"/>
      <stop offset="35%"  stop-color="#d97757"/>
      <stop offset="70%"  stop-color="#e0a35a">
        <animate attributeName="stop-color" values="#e0a35a;#eebd66;#e0a35a"
                 dur="4.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#eab861"/>
    </linearGradient>
  </defs>

  <!-- ROACH CODE wordmark, monospace to echo the terminal. A blinking block
       cursor trails it — a live prompt, "for your terminal." -->
  <text x="368" y="84" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="58"
        font-weight="800"
        fill="url(#rc-grad)"
        letter-spacing="5">ROACH CODE<tspan dx="4" fill="#f06d38">▌<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" values="0.92;1;0.92" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline: the survivor's three promises — cheap, anywhere, any model.
       Warm slate (#8b8178) keeps ~4.5:1 contrast on GitHub dark and light. -->
  <text x="370" y="120" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="14"
        fill="#8b8178"
        letter-spacing="0.4">Multi-model coding agent for your terminal  ·  cache-first  ·  one static binary</text>
</svg>
